name: Windows Free Tests
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-free-tests:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Configure git identity
        shell: bash
        run: |
          git config --global user.email "windows-tests-ci@gstack.test"
          git config --global user.name "Windows Tests CI"
          git config --global init.defaultBranch main
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Generate host skills
        run: bun run gen:skill-docs --host all
      - name: Run curated Windows-safe suite
        shell: bash
        run: bun run test:windows
        env:
          GSTACK_FREE_JOBS: '2'
