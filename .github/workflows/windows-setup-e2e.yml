name: Windows setup and build
on:
  pull_request:
    branches: [main]
    paths:
      - setup
      - scripts/build.sh
      - package.json
      - bun.lock
      - design/**
      - make-pdf/**
      - .github/workflows/windows-setup-e2e.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-setup:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build local tools
        shell: bash
        run: bun run build
      - name: Verify build outputs
        shell: bash
        run: |
          test -f design/dist/daemon.ts
          bun run design/dist/design
          bun run bin/gstack-global-discover --help
